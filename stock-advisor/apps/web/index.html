<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>StockSage AI — AI stock predictions & portfolio tools for Indian markets (NSE/BSE)</title>
    <meta
      name="description"
      content="StockSage AI gives AI-powered short & long-term stock predictions, live NSE/BSE market data, technical analysis, top-investor portfolios, and a Shadow Portfolio backtester for Indian markets."
    />
    <meta
      name="keywords"
      content="Indian stock market, NSE, BSE, stock predictions, AI stock analysis, Nifty 50, Sensex, portfolio tracker, technical analysis, superinvestors, shadow portfolio"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="StockSage AI" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="canonical" href="https://stocksage.ai/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StockSage AI" />
    <meta property="og:title" content="StockSage AI — AI stock predictions for Indian markets" />
    <meta
      property="og:description"
      content="AI-powered predictions, live NSE/BSE data, technical analysis, top-investor portfolios, and a Shadow Portfolio backtester."
    />
    <meta property="og:url" content="https://stocksage.ai/" />
    <meta property="og:image" content="https://stocksage.ai/og-image.svg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StockSage AI — AI stock predictions for Indian markets" />
    <meta
      name="twitter:description"
      content="AI-powered predictions, live NSE/BSE data, technical analysis, top-investor portfolios, and a Shadow Portfolio backtester."
    />
    <meta name="twitter:image" content="https://stocksage.ai/og-image.svg" />

    <!-- Structured data (schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "StockSage AI",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "AI-powered stock predictions, live NSE/BSE market data, technical analysis, top-investor portfolios, and a Shadow Portfolio backtester for Indian markets.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>StockSage AI requires JavaScript. Please enable it to view AI stock predictions for Indian markets.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
